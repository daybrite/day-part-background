[package]
name = "day-part-background"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MPL-2.0"
repository = "https://github.com/daybrite/day-part-background"
description = "Native background services for Day apps"
include = ["/src/**", "/platform/**", "/build.rs", "/Cargo.toml", "/README.md", "/docs/**", "/LICENSE"]

[package.metadata.day]
compat = "0.*"

# Lint policy: Clippy's `pedantic` group is on, and CI treats every warning as an error
# (`-D warnings`). The table matches the one in `day`.
[lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Day converts between float layout units and the integer pixel, index and FFI types of eight
# native toolkits. `as` is the only operator for float-to-integer, and these four lints cannot
# tell that from a narrowing integer cast, so they would need an exception at nearly every site.
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
# Function length and short or similar names are style limits this codebase does not follow:
# geometry is written in `x`/`y`/`w`/`h`, and a backend's realize and patch arms stay in one place.
many_single_char_names = "allow"
similar_names = "allow"
too_many_lines = "allow"
# A backend module imports the whole spec vocabulary, and which names it uses differs with the
# backend feature and target, so an explicit list is unused or incomplete under some of them.
wildcard_imports = "allow"
# Option structs and backend calls mirror native toolkit flags, which are booleans.
fn_params_excessive_bools = "allow"
struct_excessive_bools = "allow"
# Asks for `#[must_use]` on nearly every function that returns a value, including ones called
# for their effect. Builders are still covered by `return_self_not_must_use`.
must_use_candidate = "allow"

[dependencies]
day-bridge = "0.*"
day-core = "0.*"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "android")'.dependencies]
day-platform-android = "0.*"

[build-dependencies]
day-build = "0.*"

[workspace]

[package.metadata.day.ios]
frameworks = ["BackgroundTasks"]
platform = "13.0"

[package.metadata.day.android]
gradle-dependencies = ["androidx.work:work-runtime:2.10.1"]
java = ["platform/android"]
permissions = ["android.permission.RECEIVE_BOOT_COMPLETED", "android.permission.ACCESS_NETWORK_STATE", "android.permission.WAKE_LOCK"]
